name: Toki
options:
  bundleIdPrefix: dev.komar
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"

packages:
  TokiCore:
    path: .
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.10.0"

targets:
  Toki:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - App/Sources
      # Credits.html is rendered in the standard About panel (What's New). CI
      # overwrites it with the release notes; the committed copy is a dev-build
      # placeholder. XcodeGen files it into the Copy Resources phase by type.
      - App/Resources
    dependencies:
      - package: TokiCore
      - package: TokiCore
        product: TokiFixtures
      - package: TokiCore
        product: TokiDesign
      - package: TokiCore
        product: TokiMenuBar
      - package: Sparkle
    # Info.plist is generated by XcodeGen from these properties (project.yml stays
    # the single source of truth). `INFOPLIST_KEY_*` only supports Apple-defined
    # keys, so Sparkle's SUFeedURL/SUPublicEDKey must live here.
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Toki
        CFBundleDisplayName: Toki
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        # Sparkle auto-update — the public source and release repository hosts
        # the appcast. Older installs retain the redirected toki-releases URL.
        SUFeedURL: https://github.com/TemMax/toki/releases/latest/download/appcast.xml
        SUPublicEDKey: vJNBybtbImXuILfom9TvBEpBmVJzgkkZuZcHcVMA4Dg=
    settings:
      base:
        # Matches the app's name. It used to read `dev.komar.cstats` — the pre-rename id,
        # kept because changing it resets every Keychain ACL (the bundle id is part of the
        # designated requirement) and orphans the UserDefaults domain and TCC grants. That
        # cost was paid deliberately: the old releases were withdrawn and the handful of
        # users reinstalled, so nothing is carried forward and no migration code remains.
        PRODUCT_BUNDLE_IDENTIFIER: dev.komar.toki
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        # Apple Silicon only — x86_64 support is intentionally dropped.
        ARCHS: arm64
        CODE_SIGN_ENTITLEMENTS: App/Toki.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 44
        MARKETING_VERSION: 1.13.0
      configs:
        # Debug: hardened runtime OFF so the Xcode debugger can attach to a
        # Developer ID-signed local build.
        Debug:
          ENABLE_HARDENED_RUNTIME: NO
          # Local dev builds get the maximum 32-bit build number so Sparkle always
          # sees the running debug build as newer than any released appcast item —
          # a local build never offers to "update" itself down to a shipped version.
          # (Int32.max, not 64-bit Int.max, to stay within what CFBundleVersion /
          # version-comparison tooling parses safely.) Release/CI keep base `1`,
          # which is fixed in the public source snapshot.
          CURRENT_PROJECT_VERSION: 2147483647
        # Release: hardened runtime ON — required for notarization.
        Release:
          ENABLE_HARDENED_RUNTIME: YES
